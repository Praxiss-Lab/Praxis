name: Docker Release Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
    outputs:
      digest:
        description: Published multi-architecture image digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish versioned Praxis image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Validate release inputs and prepare build
        id: config
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(tr -d '[:space:]' < PRAXIS_VERSION)" = "$RELEASE_VERSION"
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const c = JSON.parse(fs.readFileSync('config/defaults.json', 'utf8'));
          console.log('base_image=' + c.images.agentServer + ':' + c.versions.agentServer + '-python');
          console.log('agent_version=' + c.versions.agentServer);
          console.log('automation_version=' + c.versions.automation);
          console.log('canvas_version=' + c.versions.agentCanvas);
          console.log('canvas_path=' + c.paths.canvasBasePath);
          const image = 'ghcr.io/emilio-01-t/praxis';
          const version = process.env.RELEASE_VERSION;
          console.log('tags=' + image + ':' + version + (version.includes('-') ? '' : ',' + image + ':latest'));
          JS
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.config.outputs.tags }}
          build-args: |
            AGENT_SERVER_IMAGE=${{ steps.config.outputs.base_image }}
            AGENT_SERVER_VERSION=${{ steps.config.outputs.agent_version }}
            AUTOMATION_VERSION=${{ steps.config.outputs.automation_version }}
            AGENT_CANVAS_VERSION=${{ steps.config.outputs.canvas_version }}
            PRAXIS_VERSION=${{ inputs.version }}
            OPENHANDS_BUILD_GIT_SHA=${{ inputs.commit_sha }}
            OPENHANDS_BUILD_GIT_REF=refs/tags/v${{ inputs.version }}
            VITE_BASE_PATH=${{ steps.config.outputs.canvas_path }}
            VITE_POSTHOG_API_KEY=${{ vars.POSTHOG_PROD_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
