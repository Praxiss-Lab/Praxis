<linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#4de0df"/><stop offset="1" stop-color="#73a9ff"/></linearGradient>
<linearGradient id="violet" x2="1" y2="0"><stop stop-color="#b093ff"/><stop offset="1" stop-color="#79adff"/></linearGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7891bd" stroke-opacity=".07"/></pattern>
<radialGradient id="halo"><stop stop-color="#287986" stop-opacity=".19"/><stop offset="1" stop-color="#287986" stop-opacity="0"/></radialGradient>
