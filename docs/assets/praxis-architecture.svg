<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
<title id="title">Praxis — your personal cloud architecture</title>
<desc id="desc">Two independent virtual machines above a user's laptop. Each VM contains Agent Server, Automation and persistent storage. The laptop contains the Praxis Canvas frontend and an optional local backend. Canvas connects to a selected VM or the local backend through authenticated HTTP and WebSocket.</desc>
<defs>
