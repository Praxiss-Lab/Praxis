<g font-family="DejaVu Sans, sans-serif" fill="#17263b">
<text x="64" y="70" font-size="34" font-weight="700">Praxis</text>
<text x="64" y="109" font-size="20" fill="#54657d">Your computer. Your VMs. Your personal clouds.</text>
<rect x="350" y="150" width="500" height="150" rx="20" fill="#17263b"/>
<text x="600" y="191" text-anchor="middle" font-size="15" fill="#cbd9ef">ON YOUR COMPUTER OR A SEPARATE HOST</text>
<text x="600" y="235" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Praxis frontend</text>
<text x="600" y="273" text-anchor="middle" font-size="16" fill="#cbd9ef">Canvas · conversations · files · backend selector</text>
<g fill="none" stroke="#54657d" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)">
