<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Praxis: your infrastructure, your personal clouds</title>
<desc id="desc">A Praxis frontend connects through HTTP and WebSocket to a local backend or independent personal clouds on two virtual machines. Each backend contains Agent Server, Automation and its own persistent storage. There is no shared central cloud.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#54657d"/></marker></defs>
